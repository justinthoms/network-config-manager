# Alembic command line, run from the backend folder:
#   alembic revision -m "describe the change"     (then edit the new file in migrations/versions)
#   alembic upgrade head                           (NCM also does this at every start)
# The database is DATABASE_URL from backend/.env.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
