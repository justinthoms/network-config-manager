# Publish a GitHub release when the version in backend/app/version.py changes on main.
#
# To release: set __version__ in backend/app/version.py, add the changes to CHANGELOG.md
# (a "## <version>" section) and, if you like, write docs/releases/v<version>.md, then merge
# to main. This workflow runs the tests and, if they pass and the tag does not exist yet,
# creates the tag v<version> and the release. NCM servers see it at their next update check.
name: Release

on:
  push:
    branches: [main]
    paths: ["backend/app/version.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/app/version.py)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::backend/app/version.py has no valid version: '$VERSION'"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists: nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.v.outputs.exists == 'false'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run the tests
        if: steps.v.outputs.exists == 'false'
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Release notes
        if: steps.v.outputs.exists == 'false'
        run: |
          V=${{ steps.v.outputs.version }}
          if [ -f "docs/releases/v$V.md" ]; then
            cp "docs/releases/v$V.md" notes.md
          else
            # the "## <version>" section of CHANGELOG.md
            awk -v v="$V" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md for the changes in $V." > notes.md; fi
          cat notes.md

      - name: Create the release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          PRE=""
          case "$V" in *-*) PRE="--prerelease";; esac
          gh release create "v$V" --target "$GITHUB_SHA" --title "NCM $V" --notes-file notes.md $PRE
